<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>
  <title>Create Account - WiShare</title>
  <meta name="theme-color" content="#080d1c"/>
  <link rel="icon" type="image/png" href="/static/wishare-icon.png"/>
  <link rel="stylesheet" href="/static/styles.css"/>
</head>
<body class="auth-body">
  <div class="login-wrap">
    <img class="drive-logo-svg auth-logo" src="/static/wishare-icon.png" alt="WiShare"/>
    <h2>Create Account</h2>
    <p class="subtext">to access your WiShare space</p>

    <input id="u" placeholder="Choose a username (3-32 chars)" autocomplete="username"/>
    <input id="p" type="password" placeholder="Password (min 8 characters)" autocomplete="new-password"/>
    <button id="btn" class="primary">Register</button>

    <div class="auth-footer">
      <span>Already have an account? </span>
      <a href="/login">Sign in</a>
    </div>
    <div id="msg"></div>
  </div>

  <script>
    document.getElementById('btn').onclick = async () => {
      const username = document.getElementById('u').value.trim();
      const password = document.getElementById('p').value;
      if (!username || !password) {
        document.getElementById('msg').textContent = 'Please enter both username and password';
        return;
      }
      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        if (res.ok) {
          document.getElementById('msg').style.color = '#137333';
          document.getElementById('msg').textContent = 'Account registered! Logging you in...';
          // Auto login
          const loginRes = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });
          if (loginRes.ok) {
            window.location.href = '/#/folders/root';
          } else {
            window.location.href = '/login';
          }
        } else {
          document.getElementById('msg').style.color = '#d93025';
          document.getElementById('msg').textContent = await res.text();
        }
      } catch (e) {
        document.getElementById('msg').textContent = 'Connection error. Check Wi-Fi.';
      }
    };
    document.getElementById('p').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('btn').click();
    });
  </script>
</body>
</html>
