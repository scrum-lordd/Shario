<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>
  <title>Sign in - WiShare</title>
  <meta name="theme-color" content="#080d1c"/>
  <link rel="icon" type="image/png" href="/static/wishare-icon.png"/>
  <link rel="stylesheet" href="/static/styles.css"/>
</head>
<body class="auth-body">
  <div class="login-wrap">
    <img class="drive-logo-svg auth-logo" src="/static/wishare-icon.png" alt="WiShare"/>
    <h2>Sign in</h2>
    <p class="subtext">to continue to WiShare</p>

    <input id="u" placeholder="Username" autocomplete="username"/>
    <input id="p" type="password" placeholder="Password" autocomplete="current-password"/>
    <button id="btn" class="primary">Next</button>

    <div class="auth-footer">
      <span>Don't have an account? </span>
      <a href="/register">Create account</a>
    </div>
    <div id="msg"></div>
  </div>

  <script>
    document.getElementById('btn').onclick = async () => {
      const username = document.getElementById('u').value.trim();
      const password = document.getElementById('p').value;
      if (!username || !password) {
        document.getElementById('msg').textContent = 'Please enter both username and password';
        return;
      }
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        if (res.ok) {
          window.location.href = '/#/folders/root';
        } else {
          document.getElementById('msg').textContent = await res.text();
        }
      } catch (e) {
        document.getElementById('msg').textContent = 'Connection error. Check Wi-Fi.';
      }
    };
    document.getElementById('p').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('btn').click();
    });
  </script>
</body>
</html>
