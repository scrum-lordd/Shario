<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>
  <title>Sign in - Google Drive</title>
  <link rel="stylesheet" href="/static/styles.css"/>
</head>
<body class="auth-body">
  <div class="login-wrap">
    <svg class="drive-logo-svg" viewBox="0 0 87.3 78" width="56" height="50">
      <path d="m6.6 66.85 3.85 6.65c.8 1.4 1.95 2.5 3.3 3.3l13.75-23.8h-27.5c0 1.55.4 3.1 1.2 4.5z" fill="#0066da"/>
      <path d="m43.65 25-13.75-23.8c-1.35.8-2.5 1.9-3.3 3.3l-25.4 44c-.8 1.4-1.2 2.95-1.2 4.5h27.5z" fill="#00ac47"/>
      <path d="m73.55 76.8c1.35-.8 2.5-1.9 3.3-3.3l1.6-2.75 7.65-13.25c.8-1.4 1.2-2.95 1.2-4.5h-27.502l5.852 11.5z" fill="#ea4335"/>
      <path d="m43.65 25 13.75-23.8c-1.35-.8-2.9-1.2-4.5-1.2h-18.5c-1.6 0-3.15.45-4.5 1.25z" fill="#00832d"/>
      <path d="m59.8 53h-32.3l-13.75 23.8c1.35.8 2.9 1.2 4.5 1.2h50.8c1.6 0 3.15-.45 4.5-1.2z" fill="#2684fc"/>
      <path d="m73.4 26.5-12.7-22c-.8-1.4-1.95-2.5-3.3-3.3l-13.75 23.8 16.15 28h27.45c0-1.55-.4-3.1-1.2-4.5z" fill="#ffba00"/>
    </svg>
    <h2>Sign in</h2>
    <p class="subtext">to continue to Drive</p>

    <input id="u" placeholder="Username" autocomplete="username"/>
    <input id="p" type="password" placeholder="Password" autocomplete="current-password"/>
    <button id="btn" class="primary">Next</button>

    <div class="auth-footer">
      <span>Don't have an account? </span>
      <a href="/register">Create account</a>
    </div>
    <div id="msg"></div>
  </div>

  <script>
    document.getElementById('btn').onclick = async () => {
      const username = document.getElementById('u').value.trim();
      const password = document.getElementById('p').value;
      if (!username || !password) {
        document.getElementById('msg').textContent = 'Please enter both username and password';
        return;
      }
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        if (res.ok) {
          window.location.href = '/#/folders/root';
        } else {
          document.getElementById('msg').textContent = await res.text();
        }
      } catch (e) {
        document.getElementById('msg').textContent = 'Connection error. Check Wi-Fi.';
      }
    };
    document.getElementById('p').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('btn').click();
    });
  </script>
</body>
</html>
